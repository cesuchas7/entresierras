<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entre-Sierras · Registro de Fabricaciones</title>
<style>
:root{
  --cream:#F2E9D8;
  --cream-dark:#E8DCC4;
  --carbon:#1C1714;
  --ochre:#C8924A;
  --ochre-dark:#A8743A;
  --butcher-red:#7A2E22;
  --leather:#5C4530;
  --paper-line: rgba(28,23,20,0.08);
  --shadow-soft: 0 2px 8px rgba(28,23,20,0.12);
  --shadow-stamp: 0 1px 0 rgba(28,23,20,0.15);
}

@font-face {
  font-family: 'Oswald';
  src: local('Oswald');
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #FFFFFF;
  color: var(--carbon);
  font-family: Georgia, 'Times New Roman', serif;
  min-height: 100vh;
}

body {
  background-image:
    radial-gradient(circle at 0% 0%, rgba(200,146,74,0.05) 0%, transparent 45%),
    radial-gradient(circle at 100% 0%, rgba(122,46,34,0.04) 0%, transparent 40%);
  background-attachment: fixed;
}

.app {
  max-width: 880px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

/* ---------- HEADER ---------- */
.header {
  display: flex;
  align-items: center;
  gap: 22px;
  padding-bottom: 20px;
  border-bottom: 3px double var(--carbon);
  margin-bottom: 8px;
  position: relative;
}

.header img {
  width: 110px;
  height: 110px;
  object-fit: contain;
  flex-shrink: 0;
}

.header-text p {
  margin: 0;
  font-size: 13px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--leather);
  font-family: 'Oswald', Arial, sans-serif;
}

.header-ornament {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 24px;
  color: var(--ochre-dark);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-family: 'Oswald', Arial, sans-serif;
}

.header-ornament::before, .header-ornament::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--ochre) 50%, transparent);
}

/* ---------- NAV TABS ---------- */
.tabs {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
  border-bottom: 2px solid var(--carbon);
}

.tab-btn {
  flex: 1;
  padding: 12px 16px;
  background: transparent;
  border: none;
  border-bottom: 4px solid transparent;
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--leather);
  cursor: pointer;
  transition: all 0.15s ease;
}

.tab-btn:hover { color: var(--carbon); }

.tab-btn.active {
  color: var(--carbon);
  border-bottom-color: var(--ochre);
}

/* ---------- CARD / FICHA ---------- */
.ficha {
  background: #fff;
  border: 1px solid var(--carbon);
  box-shadow: var(--shadow-soft);
  padding: 28px 26px;
  position: relative;
  margin-bottom: 24px;
}

.ficha::before {
  content: '';
  position: absolute;
  top: 8px; left: 8px; right: 8px; bottom: 8px;
  border: 1px dashed rgba(28,23,20,0.18);
  pointer-events: none;
}

.ficha-title {
  font-family: 'Oswald', Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-size: 15px;
  font-weight: 600;
  color: var(--butcher-red);
  margin: 0 0 20px 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--paper-line);
}

/* ---------- FORM ---------- */
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.field-row.single { grid-template-columns: 1fr; }
.field-row.triple { grid-template-columns: 1fr 1fr 1fr; }

@media (max-width: 600px) {
  .field-row, .field-row.triple { grid-template-columns: 1fr; }
}

.field { display: flex; flex-direction: column; gap: 6px; }

.field label {
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--leather);
}

.field input, .field select {
  font-family: Georgia, serif;
  font-size: 15px;
  padding: 9px 10px;
  border: 1px solid rgba(28,23,20,0.3);
  background: var(--cream);
  color: var(--carbon);
  border-radius: 2px;
}

.field input:focus, .field select:focus {
  outline: 2px solid var(--ochre);
  outline-offset: 1px;
  background: #fff;
}

.field input[type="number"] {
  font-family: 'Courier New', monospace;
}

.section-divider {
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--ochre-dark);
  margin: 22px 0 14px 0;
  padding-top: 14px;
  border-top: 1px dotted rgba(28,23,20,0.25);
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(28,23,20,0.12);
}

/* ---------- INGREDIENT ROWS ---------- */
.ingredient-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }

.ingredient-row {
  display: grid;
  grid-template-columns: 1.6fr 0.8fr 0.6fr auto;
  gap: 10px;
  align-items: end;
}

@media (max-width: 600px) {
  .ingredient-row { grid-template-columns: 1fr 1fr; }
}

.ingredient-row input {
  font-family: Georgia, serif;
  font-size: 14px;
  padding: 8px 9px;
  border: 1px solid rgba(28,23,20,0.3);
  background: var(--cream);
  border-radius: 2px;
}

.ingredient-row input[disabled] {
  background: var(--cream-dark);
  color: var(--leather);
  font-weight: 600;
}

.mp-row {
  grid-template-columns: 1.1fr 1.1fr 0.9fr 0.6fr auto;
}

.especia-extra-row {
  grid-template-columns: 1.3fr 0.9fr 0.6fr auto;
}

@media (max-width: 700px) {
  .mp-row, .especia-extra-row { grid-template-columns: 1fr 1fr; }
}

.btn-remove {
  background: transparent;
  border: 1px solid var(--butcher-red);
  color: var(--butcher-red);
  width: 32px;
  height: 32px;
  border-radius: 2px;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
}
.btn-remove:hover { background: var(--butcher-red); color: #fff; }

.btn-add-ingredient {
  align-self: flex-start;
  background: transparent;
  border: 1px dashed var(--leather);
  color: var(--leather);
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 9px 14px;
  cursor: pointer;
  border-radius: 2px;
  margin-top: 4px;
}
.btn-add-ingredient:hover { border-color: var(--carbon); color: var(--carbon); }

/* ---------- THREAD COLOR SWATCH ---------- */
.thread-options {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.thread-swatch {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px 7px 8px;
  border: 1px solid rgba(28,23,20,0.3);
  border-radius: 2px;
  cursor: pointer;
  background: var(--cream);
  font-size: 13px;
  font-family: Georgia, serif;
  transition: all 0.12s ease;
}

.thread-swatch.selected {
  border-color: var(--carbon);
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--carbon);
  font-weight: 600;
}

.thread-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.3);
  flex-shrink: 0;
}

/* ---------- BUTTONS ---------- */
.btn-row {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.btn-primary {
  background: var(--butcher-red);
  color: var(--cream);
  border: none;
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 14px 28px;
  cursor: pointer;
  border-radius: 2px;
  box-shadow: var(--shadow-stamp);
}
.btn-primary:hover { background: #621f16; }

.btn-secondary {
  background: transparent;
  color: var(--carbon);
  border: 1.5px solid var(--carbon);
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 14px 24px;
  cursor: pointer;
  border-radius: 2px;
}
.btn-secondary:hover { background: var(--carbon); color: var(--cream); }

/* ---------- HISTORY LIST ---------- */
.historial-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--leather);
  font-style: italic;
}

.registro-card {
  background: #fff;
  border: 1px solid rgba(28,23,20,0.25);
  border-left: 5px solid var(--ochre);
  padding: 18px 20px;
  margin-bottom: 14px;
  position: relative;
  cursor: pointer;
  transition: box-shadow 0.15s ease;
}
.registro-card:hover { box-shadow: var(--shadow-soft); }

.registro-card-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 8px;
}

.registro-producto {
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 17px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.registro-fecha {
  font-family: 'Courier New', monospace;
  font-size: 13px;
  color: var(--leather);
}

.registro-meta {
  display: flex;
  gap: 18px;
  font-size: 13px;
  color: var(--leather);
  flex-wrap: wrap;
}

.registro-meta strong { color: var(--carbon); }

.registro-actions {
  margin-top: 12px;
  display: flex;
  gap: 10px;
}

.link-btn {
  background: none;
  border: none;
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--butcher-red);
  cursor: pointer;
  padding: 4px 0;
  text-decoration: underline;
}

.stamp {
  position: absolute;
  top: 16px;
  right: 18px;
  width: 56px;
  height: 56px;
  border: 2px solid var(--ochre);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(-8deg);
  opacity: 0.75;
}

.stamp span {
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--ochre-dark);
  text-align: center;
  line-height: 1.2;
}

/* ---------- SEARCH/FILTER ---------- */
.filter-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.filter-bar input, .filter-bar select {
  font-family: Georgia, serif;
  font-size: 14px;
  padding: 9px 12px;
  border: 1px solid rgba(28,23,20,0.3);
  background: #fff;
  border-radius: 2px;
}

.filter-bar input[type="text"] { flex: 1; min-width: 160px; }

/* ---------- TOAST ---------- */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--carbon);
  color: var(--cream);
  padding: 14px 24px;
  border-radius: 3px;
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 100;
  border: 1px solid var(--ochre);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ---------- DETAIL MODAL ---------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(28,23,20,0.55);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 30px 16px;
  overflow-y: auto;
  z-index: 50;
}
.modal-overlay.show { display: flex; }

.modal-box {
  background: var(--cream);
  border: 2px solid var(--carbon);
  max-width: 620px;
  width: 100%;
  padding: 30px;
  position: relative;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--leather);
  line-height: 1;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 24px;
  margin: 18px 0;
}

@media (max-width: 600px) { .detail-grid { grid-template-columns: 1fr; } }

.detail-item dt {
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--leather);
  margin-bottom: 2px;
}
.detail-item dd { margin: 0; font-size: 15px; }

.detail-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 6px;
  font-size: 14px;
}
.detail-table th, .detail-table td {
  text-align: left;
  padding: 7px 8px;
  border-bottom: 1px solid var(--paper-line);
}
.detail-table th {
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--leather);
}

.empty-state-icon {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.4;
}
</style>
</head>

<div class="app">
  <div class="header">
    <img id="logoImg" alt="Entre-Sierras">
    <div class="header-text">
      <p>Registro de Fabricaciones · Embutido Artesano</p>
    </div>
  </div>
  <div class="header-ornament"><span>Desde 1955</span></div>

    <button class="tab-btn active" data-tab="nueva">Nueva Fabricación</button>

  </div>

  <div id="tab-nueva"></div>
  <div id="tab-historial" style="display:none;"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== DATA =====================

const PRODUCTOS = ["Salchichón", "Chorizo dulce", "Chorizo picante"];

const ESPECIAS_BASE = {
  "Salchichón": [
    { nombre: "Especia de salchichón", unidad: "kg" },
    { nombre: "Aglomerante", unidad: "kg" },
  ],
  "Chorizo dulce": [
    { nombre: "Especia de chorizo", unidad: "kg" },
    { nombre: "Aglomerante", unidad: "kg" },
  ],
  "Chorizo picante": [
    { nombre: "Especia de chorizo", unidad: "kg" },
    { nombre: "Aglomerante", unidad: "kg" },
  ],
};

const COLORES_HILO = [
  { nombre: "Blanco", hex: "#FFFFFF" },
  { nombre: "Rojo", hex: "#B23A2E" },
  { nombre: "Azul", hex: "#2E4D8F" },
  { nombre: "Rojiblanco", hex: "linear-gradient(90deg, #B23A2E 50%, #FFFFFF 50%)" },
  { nombre: "Verdiblanco", hex: "linear-gradient(90deg, #2E6B3E 50%, #FFFFFF 50%)" },
];

const TIPOS_MATERIA_PRIMA = ["Recorte cabeza", "Cordón", "Recorte 70/30"];

const STORAGE_KEY = "entresierras_fabricaciones"; // nombre de la tabla en Supabase

const SUPABASE_URL = "https://xdhkturyyoncjnzctbcn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkaGt0dXJ5eW9uY2puemN0YmNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MTIwNDAsImV4cCI6MjA5NDI4ODA0MH0.7BgsQEto0yvtWaECdkxxUItxVhjK0uq7TGh1kRQgeV8";

function supabaseHeaders() {
  return {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json",
  };
}

async function getFabricaciones() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${STORAGE_KEY}?select=*&order=creado_en.desc`,
      { headers: supabaseHeaders() }
    );
    if (!res.ok) throw new Error("Error al leer fabricaciones: " + res.status);
    const data = await res.json();
    return data.map(rowFromSupabase);
  } catch (e) {
    console.error("Error leyendo historial", e);
    showToast("No se pudo cargar el historial. Revisa tu conexión.");
    return [];
  }
}

async function crearFabricacion(registro) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${STORAGE_KEY}`, {
    method: "POST",
    headers: { ...supabaseHeaders(), "Prefer": "return=representation" },
    body: JSON.stringify(rowToSupabase(registro)),
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error("Error al guardar: " + errText);
  }
  return res.json();
}

async function eliminarFabricacionRemota(id) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${STORAGE_KEY}?id=eq.${id}`, {
    method: "DELETE",
    headers: supabaseHeaders(),
  });
  if (!res.ok) throw new Error("Error al eliminar: " + res.status);
}

function rowToSupabase(r) {
  return {
    producto: r.producto,
    fecha: r.fecha,
    lote: r.lote,
    fecha_colgado: r.fechaColgado || null,
    cantidad: r.cantidad ? Number(r.cantidad) : null,
    unidades: r.unidades ? parseInt(r.unidades, 10) : null,
    materias_primas: r.materiasPrimas || [],
    especias: r.especias || [],
    hilo: r.hilo,
    observaciones: r.observaciones || "",
  };
}

function rowFromSupabase(row) {
  return {
    id: row.id,
    producto: row.producto,
    fecha: row.fecha,
    lote: row.lote,
    fechaColgado: row.fecha_colgado,
    cantidad: row.cantidad,
    unidades: row.unidades,
    materiasPrimas: row.materias_primas || [],
    especias: row.especias || [],
    hilo: row.hilo,
    observaciones: row.observaciones,
    creadoEn: row.creado_en,
  };
}

// ===================== STATE =====================

let state = {
  materiasPrimas: [],
  ingredientesExtra: [],
  hiloSeleccionado: null,
};

let currentList = [];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// ===================== INIT =====================

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("logoImg").src = "data:image/jpeg;base64," + LOGO_B64;

  renderFormTab();
  renderHistorialTab();

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });

  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "modalOverlay") closeModal();
  });
});

function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.getElementById("tab-nueva").style.display = tab === "nueva" ? "block" : "none";
  document.getElementById("tab-historial").style.display = tab === "historial" ? "block" : "none";
  if (tab === "historial") renderHistorialTab();
}

// ===================== FORM TAB =====================

function renderFormTab() {
  const container = document.getElementById("tab-nueva");
  const today = new Date().toISOString().split("T")[0];

  container.innerHTML = `
    <div class="ficha">
      <div class="ficha-title">Ficha de Fabricación</div>

      <div class="field-row triple">
        <div class="field">
          <label for="f-producto">Tipo de producto</label>
          <select id="f-producto">
            ${PRODUCTOS.map(p => `<option value="${p}">${p}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label for="f-fecha">Fecha de fabricación</label>
          <input type="date" id="f-fecha" value="${today}">
        </div>
        <div class="field">
          <label for="f-lote">Lote</label>
          <input type="text" id="f-lote" placeholder="Ej. ES-0617-A">
        </div>
      </div>

      <div class="field-row triple">
        <div class="field">
          <label for="f-fecha-colgado">Fecha de colgado</label>
          <input type="date" id="f-fecha-colgado">
        </div>
        <div class="field">
          <label for="f-cantidad">Cantidad (kg)</label>
          <input type="number" id="f-cantidad" min="0" step="0.1" placeholder="0.0">
        </div>
        <div class="field">
          <label for="f-unidades">Unidades</label>
          <input type="number" id="f-unidades" min="0" step="1" placeholder="0">
        </div>
      </div>

      <div class="section-divider">Materia Prima</div>
      <div class="ingredient-list" id="materia-prima-list"></div>
      <button type="button" class="btn-add-ingredient" id="btn-add-mp">+ Añadir materia prima</button>

      <div class="section-divider">Especias y Aditivos</div>
      <div class="ingredient-list" id="especias-base-list"></div>
      <div class="ingredient-list" id="especias-extra-list"></div>
      <button type="button" class="btn-add-ingredient" id="btn-add-especia">+ Añadir especia</button>

      <div class="section-divider">Color de Hilo</div>
      <div class="thread-options" id="thread-options"></div>

      <div class="section-divider">Observaciones</div>
      <div class="field-row single">
        <div class="field">
          <label for="f-obs">Notas (opcional)</label>
          <input type="text" id="f-obs" placeholder="Cualquier detalle a tener en cuenta">
        </div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn-primary" id="btn-guardar">Registrar Fabricación</button>
        <button type="button" class="btn-secondary" id="btn-limpiar">Limpiar Ficha</button>
      </div>
    </div>
  `;

  document.getElementById("f-producto").addEventListener("change", renderEspeciasBase);
  document.getElementById("btn-add-mp").addEventListener("click", addMateriaPrima);
  document.getElementById("btn-add-especia").addEventListener("click", addEspeciaExtra);
  document.getElementById("btn-guardar").addEventListener("click", guardarFabricacion);
  document.getElementById("btn-limpiar").addEventListener("click", () => {
    state.materiasPrimas = [];
    state.ingredientesExtra = [];
    state.hiloSeleccionado = null;
    renderFormTab();
  });

  renderEspeciasBase();
  renderMateriaPrima();
  renderThreadOptions();
}

function renderMateriaPrima() {
  const list = document.getElementById("materia-prima-list");
  if (state.materiasPrimas.length === 0) {
    state.materiasPrimas.push({ tipo: "", proveedor: "", lote: "", cantidad: "" });
  }
  list.innerHTML = state.materiasPrimas.map((mp, i) => `
    <div class="ingredient-row mp-row">
      <input type="text" placeholder="Tipo (ej. Recorte cabeza)" value="${escapeHtml(mp.tipo || "")}" list="mp-tipos" data-mp-tipo="${i}">
      <input type="text" placeholder="Proveedor" value="${escapeHtml(mp.proveedor || "")}" data-mp-proveedor="${i}">
      <input type="text" placeholder="Lote proveedor" value="${escapeHtml(mp.lote || "")}" data-mp-lote="${i}">
      <input type="number" min="0" step="0.1" placeholder="Kg" value="${mp.cantidad || ""}" data-mp-cantidad="${i}">
      <button type="button" class="btn-remove" data-remove-mp="${i}" title="Eliminar">×</button>
    </div>
  `).join("") + `<datalist id="mp-tipos">${TIPOS_MATERIA_PRIMA.map(t => `<option value="${t}">`).join("")}</datalist>`;

  list.querySelectorAll("[data-mp-tipo]").forEach(el => {
    el.addEventListener("input", e => { state.materiasPrimas[+e.target.dataset.mpTipo].tipo = e.target.value; });
  });
  list.querySelectorAll("[data-mp-proveedor]").forEach(el => {
    el.addEventListener("input", e => { state.materiasPrimas[+e.target.dataset.mpProveedor].proveedor = e.target.value; });
  });
  list.querySelectorAll("[data-mp-lote]").forEach(el => {
    el.addEventListener("input", e => { state.materiasPrimas[+e.target.dataset.mpLote].lote = e.target.value; });
  });
  list.querySelectorAll("[data-mp-cantidad]").forEach(el => {
    el.addEventListener("input", e => { state.materiasPrimas[+e.target.dataset.mpCantidad].cantidad = e.target.value; });
  });
  list.querySelectorAll("[data-remove-mp]").forEach(el => {
    el.addEventListener("click", e => {
      state.materiasPrimas.splice(+e.target.dataset.removeMp, 1);
      renderMateriaPrima();
    });
  });
}

function addMateriaPrima() {
  state.materiasPrimas.push({ tipo: "", proveedor: "", lote: "", cantidad: "" });
  renderMateriaPrima();
}

function renderEspeciasBase() {
  const producto = document.getElementById("f-producto").value;
  const base = ESPECIAS_BASE[producto] || [];

      <input type="text" value="${esp.nombre}" disabled data-base-name="${i}">

      <input type="text" value="${esp.unidad}" disabled data-base-unidad="${i}">

  `).join("");
}

function renderEspeciasExtra() {
  const list = document.getElementById("especias-extra-list");
  list.innerHTML = state.ingredientesExtra.map((ing, i) => `
    <div class="ingredient-row especia-extra-row">
      <input type="text" placeholder="Especia" value="${escapeHtml(ing.nombre || "")}" data-extra-name="${i}">
      <input type="text" placeholder="Lote" value="${escapeHtml(ing.lote || "")}" data-extra-lote="${i}">
      <input type="number" min="0" step="0.01" placeholder="Kg" value="${ing.cantidad || ""}" data-extra-cant="${i}">
      <button type="button" class="btn-remove" data-remove-extra="${i}" title="Eliminar">×</button>
    </div>

  list.querySelectorAll("[data-extra-name]").forEach(el => {
    el.addEventListener("input", e => {
      state.ingredientesExtra[+e.target.dataset.extraName].nombre = e.target.value;

  });
  list.querySelectorAll("[data-extra-lote]").forEach(el => {

function addEspeciaExtra() {
  state.ingredientesExtra.push({ nombre: "", lote: "", cantidad: "", unidad: "kg" });

}

function renderThreadOptions() {

async function guardarFabricacion() {
  const producto = document.getElementById("f-producto").value;
  const fecha = document.getElementById("f-fecha").value;
  const lote = document.getElementById("f-lote").value.trim();
  const fechaColgado = document.getElementById("f-fecha-colgado").value;
  const cantidad = document.getElementById("f-cantidad").value;
  const unidades = document.getElementById("f-unidades").value;
  const obs = document.getElementById("f-obs").value.trim();

  if (!fecha || !lote) {
    showToast("Falta la fecha o el lote — son obligatorios.");
    return;
  }
  if (!state.hiloSeleccionado) {
    showToast("Selecciona un color de hilo.");
    return;
  }

  const especiasBase = [];
  const baseDef = ESPECIAS_BASE[producto] || [];
  document.querySelectorAll("[data-base-cant]").forEach(el => {
    const i = +el.dataset.baseCant;
    especiasBase.push({
      nombre: baseDef[i].nombre,
      lote: "",
      cantidad: el.value || "0",
      unidad: baseDef[i].unidad,
    });
  });

  const especiasExtra = state.ingredientesExtra
    .filter(e => e.nombre.trim() !== "")
    .map(e => ({ nombre: e.nombre.trim(), lote: e.lote || "", cantidad: e.cantidad || "0", unidad: "kg" }));

  const materiasPrimas = state.materiasPrimas
    .filter(mp => mp.tipo.trim() !== "" || mp.proveedor.trim() !== "")
    .map(mp => ({
      tipo: mp.tipo.trim(),
      proveedor: mp.proveedor.trim(),
      lote: mp.lote.trim(),
      cantidad: mp.cantidad || "0",
    }));

  const registro = {
    producto,
    fecha,
    lote,
    fechaColgado: fechaColgado || null,
    cantidad: cantidad || null,
    unidades: unidades || null,
    materiasPrimas,
    especias: [...especiasBase, ...especiasExtra],
    hilo: state.hiloSeleccionado,
    observaciones: obs,
  };

  const btn = document.getElementById("btn-guardar");
  btn.disabled = true;
  btn.textContent = "Guardando...";

  try {
    await crearFabricacion(registro);
    showToast("Fabricación registrada correctamente.");

    state.materiasPrimas = [];
    state.ingredientesExtra = [];
    state.hiloSeleccionado = null;
    renderFormTab();
    renderHistorialTab();
  } catch (e) {
    console.error(e);
    showToast("Error al guardar. Revisa tu conexión e inténtalo de nuevo.");
    btn.disabled = false;
    btn.textContent = "Registrar Fabricación";
  }
}

// ===================== HISTORIAL TAB =====================

async function renderHistorialTab() {
  const container = document.getElementById("tab-historial");

  container.innerHTML = `
    <div class="filter-bar">
      <input type="text" id="h-search" placeholder="Buscar por lote, proveedor o nota...">
      <select id="h-filter-producto">
        <option value="">Todos los productos</option>
        ${PRODUCTOS.map(p => `<option value="${p}">${p}</option>`).join("")}
      </select>
    </div>
    <div id="h-list"><div class="historial-empty">Cargando historial...</div></div>
  `;

  const list = await getFabricaciones();
  currentList = list;

  document.getElementById("h-search").addEventListener("input", () => renderHistorialList(list));
  document.getElementById("h-filter-producto").addEventListener("change", () => renderHistorialList(list));

  renderHistorialList(list);
}

function renderHistorialList(list) {
  const search = (document.getElementById("h-search").value || "").toLowerCase();
  const filtroProducto = document.getElementById("h-filter-producto").value;

  const filtered = list.filter(r => {
    if (filtroProducto && r.producto !== filtroProducto) return false;
    if (!search) return true;
    const haystack = [
      r.lote, ...(r.materiasPrimas || []).map(mp => `${mp.tipo} ${mp.proveedor} ${mp.lote}`), r.observaciones
    ].join(" ").toLowerCase();
    return haystack.includes(search);
  });

  const listEl = document.getElementById("h-list");

  if (filtered.length === 0) {
    listEl.innerHTML = `
      <div class="historial-empty">
        <div class="empty-state-icon">📋</div>
        ${list.length === 0 ? "Aún no hay fabricaciones registradas." : "Ninguna fabricación coincide con la búsqueda."}
      </div>
    `;
    return;
  }

  listEl.innerHTML = filtered.map(r => `
    <div class="registro-card" data-id="${r.id}">
      <div class="stamp"><span>Entre<br>Sierras</span></div>
      <div class="registro-card-top">
        <span class="registro-producto">${r.producto}</span>
        <span class="registro-fecha">${formatFecha(r.fecha)}</span>
      </div>
      <div class="registro-meta">
        <span>Lote: <strong>${escapeHtml(r.lote)}</strong></span>
        <span>Proveedor: <strong>${escapeHtml((r.materiasPrimas || []).map(mp => mp.proveedor).filter(Boolean).join(", ") || "—")}</strong></span>
        <span>Hilo: <strong>${escapeHtml(r.hilo || "—")}</strong></span>
      </div>
      <div class="registro-actions">
        <button type="button" class="link-btn" data-detail="${r.id}">Ver ficha</button>
        <button type="button" class="link-btn" data-pdf="${r.id}">Exportar PDF</button>
        <button type="button" class="link-btn" data-etiqueta="${r.id}">Exportar Etiqueta</button>
        <button type="button" class="link-btn" data-delete="${r.id}">Eliminar</button>
      </div>
    </div>
  `).join("");

  listEl.querySelectorAll("[data-detail]").forEach(el => {
    el.addEventListener("click", e => openDetail(e.target.dataset.detail));
  });
  listEl.querySelectorAll("[data-pdf]").forEach(el => {
    el.addEventListener("click", e => exportarPDF(e.target.dataset.pdf));
  });
  listEl.querySelectorAll("[data-etiqueta]").forEach(el => {
    el.addEventListener("click", e => exportarEtiqueta(e.target.dataset.etiqueta));
  });
  listEl.querySelectorAll("[data-delete]").forEach(el => {
    el.addEventListener("click", e => eliminarRegistro(e.target.dataset.delete));
  });
}

async function eliminarRegistro(id) {
  if (!confirm("¿Eliminar esta fabricación del historial? Esta acción no se puede deshacer.")) return;
  try {
    await eliminarFabricacionRemota(id);
    renderHistorialTab();
    showToast("Registro eliminado.");
  } catch (e) {
    console.error(e);
    showToast("Error al eliminar. Inténtalo de nuevo.");
  }
}

function formatFecha(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let toastTimeout;
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove("show"), 3000);
}
